<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>皮影戲・多人舞台（主持）</title>
    <script type="module" crossorigin src="./assets/live-BIccb8uO.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/characters-DFC26W7Y.js">
    <link rel="modulepreload" crossorigin href="./assets/profileRig-t9y1mpBM.js">
    <link rel="modulepreload" crossorigin href="./assets/room-CwlqpfP1.js">
    <link rel="modulepreload" crossorigin href="./assets/drawPuppet-CxKE9MRP.js">
    <link rel="stylesheet" crossorigin href="./assets/profileRig-DHsqW2BJ.css">
    <link rel="stylesheet" crossorigin href="./assets/room-CsTy8HJw.css">
  </head>
  <body class="live-page host-page">
    <header class="topbar">
      <a href="./index.html?v=jointfix1">‹ 首頁</a>
      <span class="seal">影</span>
      <strong>③ 多人舞台・主持</strong>
      <span id="phaseLabel" class="phase-pill">等候室</span>
    </header>
    <main class="live-layout">
      <aside class="live-side">
        <p class="eyebrow">房間碼（給學生）</p>
        <div class="room-code-block">
          <div id="roomCode" class="room-code" aria-live="polite" tabindex="0" title="撳一下可全選">————</div>
          <button type="button" id="btnCopyCode" class="btn secondary btn-copy-code" disabled>複製房間碼</button>
        </div>
        <p id="padHint" class="note">流程：①填色 → ②舞台練棍 → 呢度開房；學生用遙控頁入碼後「推上舞台」</p>
        <div class="live-actions">
          <button type="button" id="btnCreate" class="btn">開房</button>
          <button type="button" id="btnPlay" class="btn" disabled>開始演出</button>
          <button type="button" id="btnLobby" class="btn secondary" disabled>返回等候</button>
        </div>
        <h2 class="subhead">座位（最多 4）</h2>
        <ul id="seatList" class="seat-list"></ul>
        <p id="liveStatus" class="status" role="status"></p>
        <p class="note"><a href="./pad.html">打開遙控頁</a>　·　單機舞台仍用 <a href="./stage.html">stage.html</a></p>
      </aside>
      <section class="stage-column live-stage-column">
        <div class="stage-wrap shadow-proscenium">
          <canvas id="liveStage" width="900" height="720" aria-label="多人合成舞台"></canvas>
        </div>
      </section>
    </main>
  </body>
</html>
