<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><title>皮影戲・西遊記</title
  ><link rel="stylesheet" href="/src/redesign.css" />
  <body class="home-page">
    <main class="home">
      <div class="brand">
        <span class="seal">影</span>
        <h1>皮影戲</h1>
      </div>
      <p class="eyebrow">畫身段・操影偶・說故事</p>
      <h2>畫一隻影偶，演一段西遊</h2>
      <p class="intro">由你的色彩，到悟空的每一個動作。</p>
      <div class="home-cards">
        <button id="start">
          <span class="card-icon">✎</span><strong>開始創作</strong
          ><span>親手畫悟空，再編排三格故事</span></button
        ><a id="continue" href="./color.html" hidden
          ><span class="card-icon">▷</span><strong>繼續作品</strong
          ><span>接住這部裝置的創作</span></a
        >
      </div>
      <p id="homeStatus" role="status">作品保存在這個瀏覽器，不用登入。</p>
      <p class="preview-note">試玩版・現有悟空素材／新造型待確認</p>
      <dialog id="newDialog">
        <h2>保留舊作品，再開始</h2>
        <p>舊填色與故事會封存，仍可還原。你亦可以先下載影偶。</p>
        <button id="oldDownload">下載舊影偶 PNG</button
        ><button id="archiveStart">封存並開始</button
        ><button id="cancelNew">返回</button>
      </dialog>
      <button id="restore" hidden>還原上一份作品</button>
    </main>
    <script type="module" src="/src/home.js"></script>
  </body>
</html>
