<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皮影戲・西遊記 — 教學試作</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>皮影戲・西遊記</h1>
        <p class="badge">教學試作／校本自維 · P4 鏡頭跟姿</p>
      </div>
      <p class="char-label">角色：孫悟空（wukong）</p>
    </header>

    <main class="layout">
      <section class="stage-wrap">
        <video
          id="camera"
          class="camera"
          playsinline
          muted
          autoplay
          width="640"
          height="480"
          aria-hidden="true"
        ></video>
        <canvas id="stage" width="720" height="900" aria-label="皮影合成畫布"></canvas>
      </section>

      <aside class="panel">
        <h2>模式</h2>
        <div class="mode-row" role="radiogroup" aria-label="顯示模式">
          <label class="check">
            <input type="radio" name="mode" id="modeStatic" value="static" checked />
            靜態預覽
          </label>
          <label class="check">
            <input type="radio" name="mode" id="modePose" value="pose" />
            鏡頭跟姿
          </label>
        </div>

        <div id="poseControls" hidden>
          <button type="button" id="btnStartCam" class="btn">開啟鏡頭</button>
          <button type="button" id="btnStopCam" class="btn secondary" disabled>關閉鏡頭</button>
          <p id="mirrorLabel" class="note">
            鏡像：開（自拍預覽與骨架綁點同一套水平翻轉）。iPad 請用 HTTPS，並以按鈕觸發相機。
          </p>
        </div>

        <h2>控制</h2>
        <label class="check">
          <input type="checkbox" id="debugToggle" />
          顯示支點與骨骼線（debug）
        </label>
        <button type="button" id="btnReset" class="btn">重設站立姿勢</button>
        <button type="button" id="btnRedraw" class="btn secondary">重新繪製</button>

        <h2>身段清單</h2>
        <ul id="partList" class="part-list"></ul>

        <p class="note">
          靜態模式保留 pivot 合成驗證。鏡頭跟姿使用 MediaPipe Pose Landmarker lite（image landmarks），目標約 12–20 fps。
        </p>
        <p id="status" class="status" role="status"></p>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
