<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皮影戲・西遊記 — 教學試作</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>皮影戲・西遊記</h1>
        <p class="badge">教學試作／校本自維 · P0＋P1 靜態合成</p>
      </div>
      <p class="char-label">角色：孫悟空（wukong）</p>
    </header>

    <main class="layout">
      <section class="stage-wrap">
        <canvas id="stage" width="720" height="900" aria-label="皮影合成畫布"></canvas>
      </section>

      <aside class="panel">
        <h2>控制</h2>
        <label class="check">
          <input type="checkbox" id="debugToggle" />
          顯示支點與骨骼線（debug）
        </label>
        <button type="button" id="btnReset" class="btn">重設站立姿勢</button>
        <button type="button" id="btnRedraw" class="btn secondary">重新繪製</button>

        <h2>身段清單</h2>
        <ul id="partList" class="part-list"></ul>

        <p class="note">
          本頁只做靜態 pivot 驗證。相機／MediaPipe 姿態綁定屬 P4，暫未實作。
        </p>
        <p id="status" class="status" role="status"></p>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
