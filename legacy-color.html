<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>填色・皮影戲・西遊記</title>
    <script type="module" crossorigin src="./assets/legacyColor-DXjUvsrE.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/characters-B1I5gOZp.js">
    <link rel="modulepreload" crossorigin href="./assets/profileRig-BDjRecVu.js">
    <link rel="modulepreload" crossorigin href="./assets/undoHistory-DDcrJpP2.js">
    <link rel="modulepreload" crossorigin href="./assets/drawPuppet-DatklLZt.js">
    <link rel="modulepreload" crossorigin href="./assets/projectStorage-2-uXUYCK.js">
    <link rel="modulepreload" crossorigin href="./assets/loadRig-DaHGukC2.js">
    <link rel="stylesheet" crossorigin href="./assets/profileRig-DHsqW2BJ.css">
  </head>
  <body class="color-page">
<header class="topbar"><a id="backHome" href="./index.html">‹ 首頁</a><span class="seal">影</span><strong>畫身段</strong><span id="progressLabel"></span></header><p class="preview-note">這是你保留的舊作品；回首頁「開始創作」可畫新版側身悟空。</p>    <div class="task-bar color-task">
      <p class="task-main" id="taskMain">選畫筆或填色，在身段上著色。</p>
      <p class="task-steps">① 選身段　② 選工具／色／筆粗　③ 繪畫或填色　④ 儲存　⑤ 進入演出</p>
    </div>

    <main class="color-layout">
      <details class="color-parts"><summary>選擇身段</summary>

        <ul id="partPicker" class="part-picker" role="listbox" aria-label="選擇身段"></ul>
      </details>

      <section class="color-stage-column">
        <div class="color-canvas-wrap" id="canvasWrap"><figure class="whole-preview"><canvas id="wholePreview" width="300" height="270" aria-label="完整悟空即時預覽"></canvas><figcaption id="previewLabel">完整悟空</figcaption></figure>
          <canvas id="colorCanvas" width="160" height="160" aria-label="填色畫布"></canvas>
        </div>
        <p class="color-hint" id="colorHint">畫筆／橡皮只在不透明身段內生效；透明區與黑色輪廓為邊界。支援觸控。</p>
        <p id="colorStatus" class="status" role="status"></p>
      </section>

      <aside class="color-tools panel">
        <h2>工具</h2>
        <div class="tool-row" id="toolRow" role="toolbar" aria-label="繪畫工具">
          <button type="button" id="btnBrush" class="btn tool-btn" aria-pressed="true">畫筆</button>
          <button type="button" id="btnFill" class="btn secondary tool-btn" aria-pressed="false">填色</button>
          <button type="button" id="btnEraser" class="btn secondary tool-btn" aria-pressed="false">橡皮</button>
        </div>

        <h2>筆粗</h2>
        <div class="tool-row" id="sizeRow" role="toolbar" aria-label="筆粗">
          <button type="button" class="btn secondary size-btn" data-size="6" aria-pressed="false">細</button>
          <button type="button" class="btn size-btn" data-size="14" aria-pressed="true">中</button>
          <button type="button" class="btn secondary size-btn" data-size="30" aria-pressed="false">大</button>
        </div>

        <h2>色板</h2>
        <div id="palette" class="palette" role="listbox" aria-label="色板"></div>

        <div class="color-actions">
          <button type="button" id="btnUndo" class="btn secondary" disabled>復原</button>
          <button type="button" id="btnReset" class="btn secondary">重設此節</button>
          <button type="button" id="btnSave" class="btn">重試儲存</button>
          <button type="button" id="btnNext" class="btn secondary">下一節</button>
          <a id="btnStage" class="btn primary-done link-btn" href="./stage.html">預覽影偶／進入演出</a>
        </div>
      </aside>
    </main>

  </body>
</html>
