    <circle cx="380" cy="260" r="10" fill="#fff" stroke="#000" stroke-width="3"/>
<circle cx="230" cy="330" r="10" fill="#fff" stroke="#000" stroke-width="3"/>
<circle cx="185" cy="450" r="10" fill="#fff" stroke="#000" stroke-width="3"/>
